name: myanmar_alphabet
description: Learn Myanmar Alphabet app for children
publish_to: 'none'
version: 1.0.5+1

environment:
  # Code uses Flutter 3.32+ APIs (Color.withValues, Switch.activeThumbColor,
  # WidgetStatePropertyAll). A tight floor gives a clear error on old SDKs.
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  confetti: ^0.7.0
  google_mobile_ads: ^5.1.0
  just_audio: ^0.9.40
  shared_preferences: ^2.2.3
  unity_ads_plugin: ^0.3.20
  # advertising_id removed — collecting device ad IDs is prohibited
  # in child-directed apps under COPPA and Google Play Families Policy.

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.2
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#150D2E" # matches the dark mesh background (AppColors.meshBase)
  image: assets/icon/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/data/
    - assets/fonts/

  fonts:
    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/Pyidaungsu-2.5.3_Regular.ttf
        - asset: assets/fonts/Pyidaungsu-2.5.3_Bold.ttf
          weight: 700
